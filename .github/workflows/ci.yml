name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - name: Setup Node env
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        
      - name: Generate Next.js types
        run: pnpm --filter @repo/web exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      
